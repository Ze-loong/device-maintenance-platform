{% extends "base.html" %}
{% block title %}产线管理 - 设备预测性维护平台{% endblock %}
{% block content %}
<h1>产线管理</h1>
<div id="error-box" class="error-box" style="display:none;"></div>

<div class="panel">
    <div class="form-row">
        <strong id="form-title">新增产线</strong>
    </div>
    <form id="line-form">
        <input type="hidden" id="line-id">
        <div class="form-row">
            <label>产线编号</label><input type="text" id="line-code" placeholder="如 L003" required>
            <label>名称</label><input type="text" id="line-name" required>
        </div>
        <div class="form-row">
            <label>备注</label><input type="text" id="line-remark" style="flex:1;">
            <button type="submit" class="primary">保存</button>
            <button type="button" class="secondary" id="cancel-edit" style="display:none;">取消编辑</button>
        </div>
    </form>
    <div class="hint">产线编号创建后不可修改（网关侧上报事件时依赖这个编号，改了会导致历史事件对不上）。</div>
</div>

<div class="panel">
    <table>
        <thead><tr><th>编号</th><th>名称</th><th>备注</th><th>创建时间</th><th>操作</th></tr></thead>
        <tbody id="line-table-body"></tbody>
    </table>
    <div class="pagination" id="pagination"></div>
</div>
{% endblock %}
{% block extra_scripts %}
<script>
    let currentPage = 1;
    const pageSize = 20;

    async function loadLines(page = 1) {
        currentPage = page;
        const errorBox = document.getElementById("error-box");
        showError(errorBox, "");
        try {
            const data = await apiFetch(`/api/lines?page=${page}&page_size=${pageSize}`);
            const tbody = document.getElementById("line-table-body");
            tbody.innerHTML = "";
            for (const f of data.items) {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${f.line_code}</td>
                    <td>${f.name}</td>
                    <td>${f.remark || ""}</td>
                    <td>${new Date(f.created_at).toLocaleString("zh-CN")}</td>
                    <td>
                        <button class="secondary" onclick='editLine(${JSON.stringify(f)})'>编辑</button>
                        <button class="danger" onclick="deleteLine(${f.id}, '${f.line_code}')">删除</button>
                    </td>`;
                tbody.appendChild(tr);
            }
            renderPagination(document.getElementById("pagination"), data, loadLines);
        } catch (e) {
            showError(errorBox, e.message);
        }
    }

    function editLine(f) {
        document.getElementById("form-title").textContent = `编辑产线：${f.line_code}`;
        document.getElementById("line-id").value = f.id;
        document.getElementById("line-code").value = f.line_code;
        document.getElementById("line-code").disabled = true;
        document.getElementById("line-name").value = f.name;
        document.getElementById("line-remark").value = f.remark || "";
        document.getElementById("cancel-edit").style.display = "inline-block";
    }

    function resetForm() {
        document.getElementById("form-title").textContent = "新增产线";
        document.getElementById("line-form").reset();
        document.getElementById("line-id").value = "";
        document.getElementById("line-code").disabled = false;
        document.getElementById("cancel-edit").style.display = "none";
    }

    document.getElementById("cancel-edit").addEventListener("click", resetForm);

    document.getElementById("line-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const errorBox = document.getElementById("error-box");
        showError(errorBox, "");
        const id = document.getElementById("line-id").value;
        const payload = {
            name: document.getElementById("line-name").value,
            remark: document.getElementById("line-remark").value || null,
        };
        try {
            if (id) {
                await apiFetch(`/api/lines/${id}`, { method: "PUT", body: JSON.stringify(payload) });
            } else {
                payload.line_code = document.getElementById("line-code").value;
                await apiFetch("/api/lines", { method: "POST", body: JSON.stringify(payload) });
            }
            resetForm();
            loadLines(currentPage);
        } catch (e) {
            showError(errorBox, e.message);
        }
    });

    async function deleteLine(id, code) {
        // 软删除是不可逆的管理操作（管理端列表会立即看不到它），用原生 confirm 做一次简单的二次确认；
        // 项目其他地方约定避免触发浏览器阻塞式弹窗，但这里是用户主动点击后的确认交互，不是脚本自动触发。
        if (!window.confirm(`确认删除产线 ${code}？（软删除，历史事件不受影响）`)) { return; }
        const errorBox = document.getElementById("error-box");
        try {
            await apiFetch(`/api/lines/${id}`, { method: "DELETE" });
            loadLines(currentPage);
        } catch (e) {
            showError(errorBox, e.message);
        }
    }

    loadLines();
</script>
{% endblock %}
