# 认证链启用后，缺少用户名或密码的连接会被拒绝。
# 认证链：启用内置认证器后，用户必须通过账号密码验证。
authentication = [
  {
    # 认证方式为用户名/密码。
    mechanism = password_based
    # 用户数据保存在 EMQX 内置数据库，由数据卷持久化。
    backend = built_in_database
    # 用连接时提交的用户名查找用户，而不是客户端 ID。
    user_id_type = username
    # 对密码加盐后进行 SHA-256 哈希；不等于对 MQTT 传输链路进行加密。
    password_hash_algorithm { name = sha256, salt_position = suffix }
    # 初始化认证器时从挂载文件加载用户；不是每次启动覆盖已有用户密码。
    bootstrap_file = "/opt/emqx/etc/auth-users.csv"
    # 导入文件提供明文密码，再按上面的算法存储；CSV 本身必须保密。
    bootstrap_type = plain
  }
]
